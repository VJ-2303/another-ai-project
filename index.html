<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple Hello World website."
    />
    <title>Hello World</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="hero">
      <div class="hero__glow" aria-hidden="true"></div>
      <section class="card" aria-labelledby="welcome-heading">
        <p class="eyebrow">A tiny beginning</p>
        <h1 id="welcome-heading">Hello, world<span aria-hidden="true">!</span></h1>
        <p class="message">
          Welcome to your new corner of the web. Simple, bright, and ready for
          whatever comes next.
        </p>
        <a class="button" href="#welcome-heading">Start exploring</a>
      </section>
    </main>
  </body>
